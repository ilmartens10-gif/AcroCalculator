const NAMES={A:"A – Airborne",B:"B – Balanced",P:"P – Platform",C:"C – Combined"};
let g="A",ST={A:{bon:[]},B:{bon:[]},P:{bon:[]},C:{bon:[],mode:"A"}},CARD=[];
const f=n=>String(Math.round(n*1000)/1000).replace(".",",");
const sel=(k,lab,o,cur)=>`<label>${lab}<select onchange="set('${k}',this.value)"><option value="">–</option>${o.map(x=>`<option value="${esc(x[0])}"${x[0]==cur?" selected":""}>${esc(x[1])}</option>`).join("")}</select></label>`;
const posL=()=>g=="A"||(g=="C"&&ST.C.mode=="A")?PA:PB;
function connOpts(){const s=ST[g];if(!s.con)return[];const a=(AL[g][s.con]||"").split(" ");return(g=="B"?CNB:CNP).filter(x=>a.includes(x[0]))}
function rotOpts(){const s=ST[g];if(g=="A")return RA;if(g=="B"){if(!s.conn)return[];let r=[];BR.forEach(b=>{if(b[0].split(" ").includes(s.conn))r=r.concat(L(b[1]))});return r}
if(g=="P")return s.con?L(PRO[s.con]):[];return s.con&&CRO[s.con]?L(CRO[s.con]):[]}
function set(k,v){const s=ST[g];s[k]=v;if(k=="con"){s.conn="";s.rot="";s.rb="";s.bon=s.bon.filter(c=>{const b=BON[g].find(x=>x.c==c);return!b.a||b.a.split(" ").includes(v)})}
if(k=="conn"&&g=="B")s.rot="";
if(["sal","twi","ss","fw","op"].includes(k))bld();if(k=="rot"){s.sal=s.twi="";s.ss=s.fw=s.op=false;s.bm=""}if(k=="mode"){s.p1="";s.p2=""}draw()}
function bld(){const s=ST[g];s.bm="";if(!s.sal&&!s.twi){s.rot="";return}
let c=g=="A"?"":"C";if(s.sal)c+=(s.ss?"ss":"s")+s.sal;if(s.twi)c+="t"+s.twi;
if(g=="A"&&s.sal&&s.fw)c+="f";if(s.sal&&s.op)c+="o";
if((g=="A"?RA:RC).find(x=>x[0]==c))s.rot=c;else{s.rot="";s.bm="„"+c+"“ ist nicht im Katalog."}}
function gal(){const s=ST[g],o=[],a=(k,l)=>IMG[k]&&o.push(`<figure><img src="${IMG[k]}" alt="${esc(l)}"><figcaption>${esc(l)}</figcaption></figure>`);
a({A:"ca",B:"cb",P:"cp",C:"cc"}[g]+":"+s.con,s.con);if(g=="B"||g=="P")a((g=="B"?"nb":"np")+":"+s.conn,s.conn);
const pk=posL()==PA?"pa":"pb";a(pk+":"+s.p1,"P1 "+s.p1);if(s.p2)a(pk+":"+s.p2,"P2 "+s.p2);return o.length?`<div class="gal">${o.join("")}</div>`:""}
function tog(c,on){const b=ST[g].bon;ST[g].bon=on?b.concat(c):b.filter(x=>x!=c);draw()}
function calc(){const s=ST[g],w=[],pt=[["Base Mark",.5]],seg=[g];let dd=.5,ok=true;
const add=(l,v)=>{dd+=v;pt.push([l,v])};
const con=CON[g].find(x=>x[0]==s.con);if(con){add("C – "+s.con,con[1]);seg.push(s.con)}else ok=false;
if(g=="A"||g=="C"){const d=(g=="C"?DIRC:DIR).find(x=>x[0]==s.dir);if(d){add("D – "+d[0],d[1]);seg.push(d[0])}else ok=false}
else{const c=connOpts().find(x=>x[0]==s.conn);if(c){add("S – "+c[0],c[1]);seg.push(c[0])}else ok=false}
const pl=posL(),p1=pl.find(x=>x.c==s.p1),p2=pl.find(x=>x.c==s.p2);
if(p1){add("P1 – "+p1.n,p1.v)}else ok=false;
if(p1&&p2){if(p1.c==p2.c)w.push("Position 2 muss sich von Position 1 unterscheiden.");else add("P2 – "+p2.n,p2.v2)}
if(p1)seg.push(p1.c+(p2&&p1.c!=p2.c?"/2"+p2.c:""));
if(g=="C"&&s.rb){const r=rotOpts().find(x=>x[0]==s.rb);if(r){add("R – "+r[0],r[1]);seg.push(r[0])}}
const ro=g=="C"?RC:rotOpts(),rv=s.rot&&ro.find(x=>x[0]==s.rot);
if(rv){add((g=="A"||g=="C"?"T – ":"R – ")+rv[0],rv[1]);seg.push(rv[0])}
const bl=BON[g].filter(b=>s.bon.includes(b.c));
bl.forEach(b=>{add("B – "+b.c,b.v);seg.push(b.c.replace("+C-Roll","-C-Roll"))});
const nb=new Set(bl.map(b=>b.c.split("+")[0]));if(nb.size>2)w.push("Max. 2 verschiedene Boni pro Acro.");
const gr={};bl.forEach(b=>{if(b.g){(gr[b.g]=gr[b.g]||[]).push(b.c)}});
Object.values(gr).forEach(a=>{if(a.length>1)w.push("Nicht kombinierbar: "+a.join(" + "))});
const has=c=>s.bon.includes(c);
if(g=="A"){if(has("Catch")&&!has("Dbl"))w.push("Catch nur zusammen mit Dbl.");
if(s.rot&&/^ss/.test(s.rot)&&(s.p1!="ln"||s.p2||has("Pos3")))w.push("Straight-body-Salto (ss): nur Position 1 = Line, keine weitere Position.");
if(s.rot&&/o$/.test(s.rot)){if(!["tk","pk"].includes(s.p1))w.push("„Open“ (o): Position 1 muss Tuck oder Pike sein.");if(s.p2!="ln"&&!has("Pos3"))w.push("„Open“ (o): Line muss als Position 2 oder Pos3 folgen.")}
if(s.rot&&/^(C|ct)/.test(s.rot)&&s.dir&&s.dir!="Side")w.push("Cartwheel: Richtung = Side.");
if(s.rot&&/^(H|ht|hd|hs)/.test(s.rot)&&s.dir&&!["Forw","Back"].includes(s.dir))w.push("Handspring: Richtung = Forw oder Back.");
if(has("Hula")&&!["rg","ja"].includes(s.p1)&&!["rg","ja"].includes(s.p2))w.push("Hula: Ring- oder Jay-Position nötig.")}
if(g=="B"&&has("Hold")&&s.rot)w.push("Hold und Rotation der Konstruktion nicht gleichzeitig.");
if(g=="P"){if(has("Porp")&&s.p1!="bb")w.push("Porp: Position 1 muss Bamboo (bb) sein.");if(has("Arch")&&!["qu","dr"].includes(s.p1))w.push("Arch: Position 1 muss Queen oder Drop sein.")}
if(g=="C"&&["Thr>FF","Thr>F"].includes(s.con)&&s.mode=="A")w.push("Thr>FF / Thr>F: nur Gruppe-B-Positionen erlaubt.");
if(g=="C"&&has("Thr>head>")&&has("Jump"))w.push("Thr>head> nicht mit Jump-Bonus.");
const code=ok?seg.join("-"):"";
const keys=[];if(ok){if(g=="A")[s.p1,s.p2].forEach(x=>x&&keys.push("Position "+x));if(g=="B")keys.push("Konstruktion "+s.con,"Verbindung "+s.conn);if(g=="C")keys.push("Konstruktion "+s.con);
if(g=="P"){keys.push("Konstruktion "+s.con,"Verbindung "+s.conn);[s.p1,s.p2].forEach(x=>x&&keys.push("Position "+x));bl.forEach(b=>b.c!="Pos3"&&keys.push("Bonus "+b.c))}}
return{dd:Math.round(dd*1000)/1000,pt,w,code,ok,keys}}
function draw(){const s=ST[g];
$("tabs").innerHTML=Object.keys(NAMES).map(k=>`<button class="${k==g?"on":""}" onclick="g='${k}';draw()">${NAMES[k]}</button>`).join("");
const cOpt=CON[g].map(x=>[x[0],x[0]+" ("+f(x[1])+")"]),pl=posL();
let h=`<h2>${NAMES[g]}</h2><div class="g">`+sel("con","Konstruktion (C)",cOpt,s.con);
if(g=="A"||g=="C")h+=sel("dir","Richtung (D)",(g=="C"?DIRC:DIR).map(x=>[x[0],x[0]+" ("+f(x[1])+")"]),s.dir);
else h+=sel("conn","Verbindung / Grip (S)",connOpts().map(x=>[x[0],x[0]+" ("+f(x[1])+")"]),s.conn);
if(g=="C")h+=sel("mode","Positionstabelle",[["A","Gruppe A (fliegt)"],["B","Gruppe B (bleibt auf Formation)"]],s.mode);
if(g=="C")h+=sel("rb","Rotation Konstruktion (R)",rotOpts().map(x=>[x[0],x[0]+" ("+f(x[1])+")"]),s.rb);
const ro=g=="C"?RC:rotOpts();
h+=sel("rot",g=="A"||g=="C"?"Rotation in der Luft (T)":"Rotation Konstruktion (R)",ro.map(x=>[x[0],x[0]+" ("+f(x[1])+")"]),s.rot)+`</div>`;
if(g=="A"||g=="C")h+=`<h2 style="margin-top:10px">Saltos / Rotationen</h2><div class="g">`+sel("sal","Salto",[["1","1"],["1.5","1,5"],["2","2"]],s.sal)+sel("twi","Twist",[["0.5","0,5"],["1","1"],["1.5","1,5"],["2","2"],["2.5","2,5"],["3","3"]],s.twi)+`</div><div class="bon" style="margin-top:6px">`+[["ss","Straight body (ss)"],["fw","Forwards (f)"],["op","Open (o)"]].filter(x=>!(g=="C"&&x[0]=="fw")).map(x=>`<label><input type="checkbox" ${s[x[0]]?"checked":""} onchange="set('${x[0]}',this.checked)">${x[1]}</label>`).join("")+(s.bm?`<span class="w">${esc(s.bm)}</span>`:"")+`</div>`;
h+=`<h2 style="margin-top:10px">Boni (B)</h2><div class="bon">`;
h+=BON[g].map(b=>{const dis=b.a&&!(s.con&&b.a.split(" ").includes(s.con));return`<label class="${dis?"dis":""}"><input type="checkbox" ${s.bon.includes(b.c)?"checked":""} ${dis?"disabled":""} onchange="tog('${b.c}',this.checked)">${esc(b.c)} (${f(b.v)})</label>`}).join("")+"</div>";
$("form").innerHTML=h;
const r=calc();
$("out").innerHTML=`<div class="sm">Difficulty Degree</div><div class="dd">${f(r.dd)}</div>`+(r.ok?`<div class="code" id="cd">${esc(r.code)}</div>`:`<div class="sm">Mindestangaben fehlen (A/C: Konstruktion + Richtung + Pos 1 · B/P: Konstruktion + Verbindung + Pos 1).</div>`)+
r.w.map(x=>`<div class="w">⚠ ${esc(x)}</div>`).join("")+(r.ok&&!r.w.length?`<div class="v">✓ Code gültig</div>`:"")+
gal()+`<table>${r.pt.map(x=>`<tr><td>${esc(x[0])}</td><td>${f(x[1])}</td></tr>`).join("")}</table>
<button class="b" ${r.ok&&!r.w.length?"":"disabled"} onclick="addC()">Zur Coach Card</button><button class="b" ${r.ok?"":"disabled"} onclick="navigator.clipboard&&navigator.clipboard.writeText('${esc(r.code).replace(/'/g,"\\'")}')">Code kopieren</button>`;
cardDraw()}
function addC(){const r=calc(),d=[];CARD.forEach(e=>{if(e.g==g)e.keys.forEach(k=>{if(r.keys.includes(k)&&!d.includes(k))d.push(k)})});
if(d.length){alert("Wiederholung nicht erlaubt (Regel 1.11): "+d.join(", "));return}CARD.push({g,code:r.code,dd:r.dd,keys:r.keys});cardDraw()}
function del(i){CARD.splice(i,1);cardDraw()}
function cardDraw(){$("card").innerHTML=`<h2>Coach Card</h2>`+(CARD.length?`<table>${CARD.map((e,i)=>`<tr><td style="font-family:ui-monospace,monospace;word-break:break-all">${esc(e.code)}</td><td>${f(e.dd)} <a href="#" onclick="del(${i});return false">✕</a></td></tr>`).join("")}<tr><td><b>Summe DD</b></td><td><b>${f(CARD.reduce((a,e)=>a+e.dd,0))}</b></td></tr></table>`:`<div class="sm">Noch keine Acros. Wiederholungsregeln (Abschnitt 1.11) werden beim Hinzufügen geprüft.</div>`)}
const $=id=>document.getElementById(id);draw();
</script></body></html>
